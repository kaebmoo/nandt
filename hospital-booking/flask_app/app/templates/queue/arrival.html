<!-- templates/queue/arrival.html — ยืนยันเช็คอินสำหรับนัดตามเวลา (ไม่ใช้คิว) -->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>เช็คอินสำเร็จ — {{ service_point.name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Sarabun', sans-serif; } </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-50 to-blue-50">
    <div class="max-w-md mx-auto px-4 py-8">
        <div class="bg-white rounded-xl shadow-md p-8 text-center">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-green-100 mb-4">
                <svg class="w-8 h-8 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                </svg>
            </div>

            <p class="text-gray-600">เช็คอินสำเร็จ · {{ service_point.name }}</p>
            <h1 class="text-2xl font-bold text-gray-900 mt-4">บันทึกการมาถึงแล้ว</h1>
            <p class="text-gray-700 mt-4">
                นัดนี้เป็นบริการตามเวลา จึงไม่ต้องรับหมายเลขคิว
            </p>

            <div class="mt-6 text-left rounded-lg bg-gray-50 border border-gray-200 p-4 space-y-2">
                <div class="flex justify-between text-sm">
                    <span class="text-gray-500">รหัสการจอง</span>
                    <span class="font-semibold text-gray-900">{{ appointment.booking_reference or '-' }}</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-gray-500">ชื่อผู้รับบริการ</span>
                    <span class="font-semibold text-gray-900">{{ appointment.guest_name or '-' }}</span>
                </div>
            </div>

            <p class="text-xs text-gray-400 mt-6">กรุณารอเจ้าหน้าที่เรียกตามเวลานัด</p>
        </div>

        <p class="text-center text-xs text-gray-400 mt-4">นัดดี · NudDee</p>
    </div>
</body>
</html>
