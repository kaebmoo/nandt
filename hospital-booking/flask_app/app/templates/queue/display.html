<!-- templates/queue/display.html — จอแสดงคิวสำหรับ TV (auto-refresh, display ล้วน) -->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คิว — {{ service_point.name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Sarabun', sans-serif; } </style>
</head>
<body class="min-h-screen bg-gray-50">
    <div class="max-w-7xl mx-auto px-6 py-8">

        <!-- header -->
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-3">
                <svg class="w-9 h-9 text-purple-600" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M11 3a1 1 0 10-2 0v1a1 1 0 102 0V3zM15.657 5.757a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zM5 10a1 1 0 01-1 1H3a1 1 0 110-2h1a1 1 0 011 1zM8 16v-1h4v1a2 2 0 11-4 0zM12 14c.015-.34.208-.646.477-.859a4 4 0 10-4.954 0c.27.213.462.519.476.859h4.002z"/>
                </svg>
                <h1 class="text-3xl font-bold text-gray-900">{{ service_point.name }}</h1>
            </div>
            <div id="clock" class="text-2xl font-semibold text-gray-500"></div>
        </div>

        <!-- เนื้อหา (ถูก poll มาสลับ) -->
        <div id="queue-body">
            {% include 'queue/_display_body.html' %}
        </div>
    </div>

    <!-- ปุ่ม unlock เสียง (browser block autoplay จนกว่าจะมี user gesture) — §14 -->
    <button id="audio-unlock"
            class="fixed bottom-6 right-6 px-5 py-3 rounded-full bg-purple-600 text-white text-lg
                   font-semibold shadow-lg hover:bg-purple-700 transition-colors z-50">
        🔊 เริ่มระบบเสียง
    </button>

    <script>
        // display ล้วน — JS เป็นแค่ adapter (ดึง fragment ที่ render จาก server แล้วสลับ), logic อยู่ Python
        const POLL_URL = "{{ nav_url('queue.display_body', service_point_id=service_point.id) }}";
        const REFRESH_MS = 4000;

        async function refresh() {
            try {
                const res = await fetch(POLL_URL, { headers: { 'X-Requested-With': 'fetch' } });
                if (res.ok) {
                    document.getElementById('queue-body').innerHTML = await res.text();
                    checkAudio();
                }
            } catch (e) { /* เครือข่ายสะดุด — รอบหน้า poll ใหม่ */ }
        }

        function tick() {
            document.getElementById('clock').textContent =
                new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        // ----- เสียงเรียกคิว (§14): เล่น playlist ทีละ clip ไม่ทับ; เล่นเมื่อ key เปลี่ยน -----
        const audioEl = new Audio();
        let unlocked = false, lastKey = null, queue = [], playing = false;

        function playNext() {
            if (queue.length === 0) { playing = false; return; }
            playing = true;
            audioEl.src = queue.shift();
            audioEl.play().catch(() => { playing = false; });
        }
        audioEl.onended = playNext;
        audioEl.onerror = playNext;   // clip หาย -> ข้ามไปตัวถัดไป ไม่ค้าง

        function enqueue(clips, repeat, volume) {
            audioEl.volume = Math.max(0, Math.min(1, Number.isFinite(volume) ? volume : 1));  // honor 0 (mute)
            for (let r = 0; r < (repeat || 1); r++) clips.forEach(c => queue.push(c));
            if (!playing) playNext();
        }

        function currentAudio() {
            const el = document.getElementById('queue-audio');
            if (!el) return null;
            let clips = [];
            try { clips = JSON.parse(el.dataset.clips || '[]'); } catch (e) {}
            return { key: el.dataset.key || '', clips,
                     volume: parseFloat(el.dataset.volume || '1'),
                     repeat: parseInt(el.dataset.repeat || '1', 10) };
        }

        function checkAudio() {           // เรียกหลัง poll: ถ้ามีการเรียกใหม่ -> เล่น
            const a = currentAudio();
            if (!a || !a.key || a.key === lastKey) return;
            lastKey = a.key;
            if (unlocked && a.clips.length) enqueue(a.clips, a.repeat, a.volume);
        }

        document.getElementById('audio-unlock').addEventListener('click', function () {
            unlocked = true;
            this.style.display = 'none';
            const a = currentAudio();     // เล่นคิวที่กำลังเรียกอยู่ทันที (อยู่ใน user gesture -> unlock)
            if (a && a.clips.length) { lastKey = a.key; enqueue(a.clips, a.repeat, a.volume); }
        });

        checkAudio();                     // บันทึก key ปัจจุบัน (ยังไม่เล่นจนกว่าจะ unlock)
        setInterval(refresh, REFRESH_MS);
        setInterval(tick, 1000);
        tick();
    </script>
</body>
</html>
